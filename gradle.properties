# --- JVM / Gradle ---------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Android -------------------------------------------------------------------
android.useAndroidX=true
# AGP 9 ships Kotlin support built in and, by default, refuses to let the Kotlin Gradle
# plugin (`org.jetbrains.kotlin.android`) apply at all:
#
#   "The 'org.jetbrains.kotlin.android' plugin is no longer required for Kotlin support
#    since AGP 9.0."
#
# ConstructAR keeps the real Kotlin plugin, because `compilerOptions` (jvmTarget,
# `allWarningsAsErrors` - a product requirement) and the Compose compiler plugin are
# configured through it, and because AGP's built-in Kotlin applies no public plugin id that
# the rest of the build can key on. Opting out is a supported, documented AGP 9 switch.
android.builtInKotlin=false
# Paired with the line above: the Kotlin Gradle plugin refuses to apply on AGP 9's new DSL
# ("class LibraryExtensionImpl cannot be cast to BaseExtension"), so opting out of built-in
# Kotlin means opting out of the new DSL as well. Both come back in the same change.
android.newDsl=false
android.nonTransitiveRClass=true
# Two warning families are unavoidable while the Kotlin Gradle plugin is kept on AGP 9:
# the "option setting is deprecated" notices for the two switches above, and the legacy
# variant-API notices that KGP itself triggers (`applicationVariants`, `libraryVariants`,
# `testVariants`, `unitTestVariants`). Nothing outside the plugins calls those APIs, so the
# notices are noise; silencing them keeps `--warning-mode=all` output meaningful.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
# 16 KB page size required by Google Play for apps targeting Android 15+
android.experimental.nativeLibraryAlignmentPageSize=16k

# --- Kotlin --------------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true
# Compile in-process: the build-tools-API worker reports one diagnostic per failed task,
# which turns a five-error file into five CI runs. In-process compilation surfaces the whole
# diagnostic list in one shot, and there is nothing to gain from forking for a project this
# small.
kotlin.compiler.execution.strategy=in-process

# --- ConstructAR ---------------------------------------------------------------
# Default monocular-depth model asset. Builders who bundle the Apache-2.0
# Depth Anything V2 Small export drop it at this path; an empty value means
# "model not bundled — user imports it from Settings or AI depth stays off".
constructar.depthModelAsset=models/depth_anything_v2_small_int8.tflite
# Optional RTAB-Map sources (BSD-3-Clause). When present, CMake compiles the real
# SLAM back-end; otherwise :native-slam builds its self-contained pose-graph
# fallback. See docs/SETUP.md §3.
constructar.rtabmap.dir=
