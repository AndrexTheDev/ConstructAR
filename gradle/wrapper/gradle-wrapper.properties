# Gradle wrapper configuration.
#
# The wrapper JAR and scripts are intentionally not committed (they are 60 kB of binary that
# every checkout regenerates identically). Run once:
#
#   gradle wrapper --gradle-version 9.1
#
# Android Studio also offers to do this when it opens the project. After that, `./gradlew`
# works as documented in README.md and docs/SETUP.md.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
