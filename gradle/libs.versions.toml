# Version catalog — pinned to the versions the project is developed against.
# Everything here is license-fee free: Apache-2.0, MIT or BSD-3-Clause only.
[versions]
# Build tools
agp = "9.4.1"
kotlin = "2.4.21"
java = "21"

# AndroidX
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
navigationCompose = "2.10.2"
composeBom = "2026.09.00"
documentFile = "1.1.0"

# Kotlin
coroutines = "1.11.0"
serialization = "1.12.0"

# AR / 3D rendering
arCore = "1.57.0"
# SceneView for Android: `sceneview` (Filament 3D) + `arsceneview` (ARCore layer).
# NOTE: `sceneview-compose` is the *multiplatform* artifact; the native Android
# app uses `arsceneview`, which carries the Compose DSL for AR on Android.
# 4.63.0 is pinned exactly: ConstructAR calls the typed Compose factories
# (`rememberEngine`, `rememberModelLoader`, `rememberMaterialLoader`,
# `rememberEnvironmentLoader`, `rememberScene`, `rememberARCameraNode`) and the
# typed `MaterialLoader` colour factories directly — no reflection, so a minor
# bump must be a deliberate, compiled change, not a silent one.
sceneview = "4.63.0"
filament = "1.72.1"
kotlinMath = "1.8.0"

# On-device inference (Depth Anything V2 Small, INT8)
litert = "2.3.0"

# Testing
junit = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
robolectric = "4.17"
# Roborazzi renders the Compose screens to PNG on the JVM, so the screenshot matrix needs no
# emulator and no hardware. Apache-2.0.

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentFile" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Kotlin
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlin-math = { group = "dev.romainguy", name = "kotlin-math", version.ref = "kotlinMath" }

# AR / 3D
arcore = { group = "com.google.ar", name = "core", version.ref = "arCore" }
sceneview = { group = "io.github.sceneview", name = "sceneview", version.ref = "sceneview" }
arsceneview = { group = "io.github.sceneview", name = "arsceneview", version.ref = "sceneview" }
filament-android = { group = "com.google.android.filament", name = "filament-android", version.ref = "filament" }

# ML
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
litert-gpu = { group = "com.google.ai.edge.litert", name = "litert-gpu", version.ref = "litert" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
