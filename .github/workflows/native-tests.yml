name: native-tests

# The C++ core (TSDF, Surface Nets, pose graph) has no Android dependency, so it is built and
# tested with a plain compiler on every push. That keeps the geometry honest even when the
# Gradle/NDK toolchain is unavailable in an environment.
permissions:
  contents: read
  pull-requests: write

on:
  push:
    paths:
      - "native-slam/src/main/cpp/**"
      - ".github/workflows/native-tests.yml"
  pull_request:
    paths:
      - "native-slam/src/main/cpp/**"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        optimisation: [-O1, -O2]
    steps:
      - uses: actions/checkout@v4

      - name: Build the host test binary (${{ matrix.compiler }} ${{ matrix.optimisation }})
        run: |
          ${{ matrix.compiler }} -std=c++20 ${{ matrix.optimisation }} -pthread -Wall -Wextra -Werror \
            -I native-slam/src/main/cpp \
            native-slam/src/main/cpp/tsdf/volume.cpp \
            native-slam/src/main/cpp/tsdf/surface_nets.cpp \
            native-slam/src/main/cpp/slam/pose_graph.cpp \
            native-slam/src/main/cpp/slam/rtabmap_bridge.cpp \
            native-slam/src/main/cpp/tests/host_tests.cpp \
            -o host_tests

      # The run output is captured so a failure can be reported on the pull request at the end of
      # the job: the Actions log endpoint redirects to a host that is not always reachable, and a
      # failing assertion whose message cannot be read wastes a full CI cycle (finding 111's fix
      # was diagnosed from a runner that only said "Run failed").
      - name: Run
        id: run_tests
        run: |
          set -o pipefail
          ./host_tests 2>&1 | tee /tmp/host_tests.log

      # The optional RTAB-Map branch, compiled in the configuration the app would use. No
      # RTAB-Map checkout is available here, so the translation unit is built against
      # `tests/rtabmap-stubs` - headers that mirror the API of the RTAB-Map version
      # CMakeLists.txt pins (`rtabmap/core/Rtabmap.h`, `SensorData` with an odometry pose). This
      # is a shape check, not a link: it is what proves the branch still compiles, which it did
      # not for as long as the includes sat inside `namespace constructar` (finding 107).
      - name: Compile the RTAB-Map branch against stub headers
        run: |
          ${{ matrix.compiler }} -std=c++20 ${{ matrix.optimisation }} -Wall -Wextra -Werror \
            -DCONSTRUCTAR_WITH_RTABMAP=1 \
            -I native-slam/src/main/cpp \
            -I native-slam/src/main/cpp/tests/rtabmap-stubs \
            -c native-slam/src/main/cpp/slam/rtabmap_bridge.cpp -o /tmp/rtabmap_bridge.o

      # Switching the back-end on is a question about paths, not about code: the guard has to
      # accept the layout upstream actually has, and the archives have to be found where the
      # documented build puts them. No checkout exists here, so the probe runs in script mode
      # against fake trees - `cmake` alone, no NDK, no compiler (finding 110).
      - name: Check the RTAB-Map layout probe
        run: cmake -P native-slam/src/main/cpp/tests/rtabmap-layout-check.cmake

      - name: Report the failure on the pull request
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The pull request this run belongs to, from the event itself - see the same note in
          # `.github/workflows/android-build.yml`. This workflow is triggered by a `pull_request`
          # for every change under the C++ tree and by a `push` only for those paths, so every
          # failure it ever reports comes from a run whose `GITHUB_REF_NAME` is `<pr>/merge`. The
          # branch lookup therefore never matched, the step exited 0 and the comment was never
          # posted: the reporter built because "a failing assertion whose message cannot be read
          # wastes a full CI cycle" (finding 111) had been wasting them ever since (finding 157).
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -uo pipefail
          pr="${PR_NUMBER:-}"
          if [ -z "$pr" ]; then
            pr=$(gh pr list --head "$HEAD_REF" --json number -q '.[0].number' 2>/dev/null || true)
          fi
          if [ -z "${pr:-}" ]; then
            echo "::warning::no open pull request for '$HEAD_REF' - the failure report was not posted"
            exit 0
          fi
          {
            echo "### native-tests failed"
            echo ""
            echo "commit \`$GITHUB_SHA\` on \`$HEAD_REF\`, job ${{ matrix.compiler }} ${{ matrix.optimisation }}"
            echo ""
            echo '```'
            if [ -f /tmp/host_tests.log ]; then
              tail -n 60 /tmp/host_tests.log
            else
              echo "the build failed before the tests ran"
            fi
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$pr" --body-file /tmp/comment.md
