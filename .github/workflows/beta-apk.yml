name: beta-apk

# The build a person can install and test with (finding 255).
#
# `assembleBeta` is a build type, not a flavour of `release`: it carries `BETA_BUILD = true`, its
# own application id (`.beta`, so it installs next to the sold app instead of replacing it), the
# debug signing key, and everything unlocked. No licence key is minted for it and nothing about it
# reaches `assembleRelease`.
#
# Triggered by hand and by a push that touches this file: a beta APK is an artifact somebody asked
# for, not something every commit produces. `workflow_dispatch` needs the `actions: write` scope,
# which a scoped CI token need not have - a push touching this file is the fallback trigger.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/beta-apk.yml"
      - "app/build.gradle.kts"
      # Whatever the person holding the phone can see belongs in this list: the reports that matter
      # come from a device (findings 257, 258, 259 and 260 all did), and an APK that is three fixes
      # old is worse than none. The build is a few minutes and the artifact is kept for 30 days.
      - "app/src/main/kotlin/com/constructar/app/ui/**"
      - "app/src/main/kotlin/com/constructar/app/diagnostics/**"
      - "app/src/main/res/**"
      - "app/src/main/AndroidManifest.xml"

concurrency:
  group: beta-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # `write` is for one thing only: publishing the APK as a release asset, so the person holding
  # the phone gets a direct link instead of a login-walled ZIP they have to extract (finding 261).
  contents: write

env:
  GRADLE_VERSION: "9.6.0"
  JAVA_VERSION: "21"
  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.22.1"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  beta:
    name: assembleBeta
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install NDK, CMake and platform licenses
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager)"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          yes | "$SM" --licenses > /dev/null 2>&1 || true

          install() {
            echo "--- installing $1"
            "$SM" --install "$1" || echo "WARN: could not install $1"
          }
          install "platform-tools"
          install "cmake;${CMAKE_VERSION}"
          install "ndk;${NDK_VERSION}"

          if [ ! -d "$SDK/ndk/${NDK_VERSION}" ]; then
            ALT=$(ls "$SDK/ndk" 2>/dev/null | sort -V | tail -n 1 || true)
            echo "WARN: NDK ${NDK_VERSION} missing; newest installed is '${ALT:-none}'"
            if [ -n "${ALT:-}" ]; then
              sed -i "s/ndkVersion = \"[^\"]*\"/ndkVersion = \"$ALT\"/" native-slam/build.gradle.kts
              echo "ANDROID_NDK_HOME=$SDK/ndk/$ALT" >> "$GITHUB_ENV"
            fi
          else
            echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          base=https://services.gradle.org/distributions
          code=$(curl -sSL -o /tmp/gradle.zip -w '%{http_code}' "$base/gradle-${GRADLE_VERSION}-bin.zip" || true)
          if [ "$code" != "200" ]; then
            latest=$(curl -sSL https://services.gradle.org/versions/current \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
            echo "falling back to current Gradle $latest"
            curl -sSL -o /tmp/gradle.zip "$base/gradle-${latest}-bin.zip"
          fi
          rm -rf /opt/gradle && mkdir -p /opt/gradle
          unzip -q /tmp/gradle.zip -d /opt/gradle
          GRADLE_BIN=$(dirname "$(find /opt/gradle -maxdepth 3 -name gradle -type f | head -n 1)")
          echo "$GRADLE_BIN" >> "$GITHUB_PATH"
          "$GRADLE_BIN/gradle" --version

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/jdks
          key: beta-gradle-${{ env.GRADLE_VERSION }}-${{ hashFiles('gradle/libs.versions.toml', '**/build.gradle.kts') }}
          restore-keys: beta-gradle-${{ env.GRADLE_VERSION }}-

      - name: assembleBeta
        run: |
          set -uo pipefail
          code=0
          gradle --no-daemon --stacktrace :app:assembleBeta > /tmp/beta.log 2>&1 || code=$?
          tail -n 40 /tmp/beta.log
          if [ "$code" != 0 ]; then
            # The same helper the main build uses: a failed run's raw log is not reachable through
            # every network, but its check-run annotations are (see scripts/ci_annotate.sh).
            bash scripts/ci_annotate.sh /tmp/beta.log "assembleBeta failed" "0"
            exit "$code"
          fi

      - name: Name the APK after the commit it came from
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/beta -name '*.apk' 2>/dev/null | head -n 1 || true)
          if [ -z "$apk" ]; then
            echo "::error title=no APK produced::app/build/outputs/apk/beta holds no .apk - the assemble step reported success but left nothing behind"
            find app/build/outputs -maxdepth 3 -type d 2>/dev/null | head -n 20 || true
            exit 1
          fi
          out="ConstructAR-beta-${GITHUB_SHA::7}.apk"
          cp "$apk" "$out"
          ls -l "$out"
          echo "APK=$out" >> "$GITHUB_ENV"

      - name: Say which languages the APK actually carries
        run: |
          set -uo pipefail
          # "The APK is only in English although the app has six languages" was the first device
          # report nobody could answer from here (finding 260). The APK can: its resources are
          # dumped and the six locales are looked for, so the next build either proves they are
          # packaged or fails and says which one is missing.
          AAPT2=$(ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "${AAPT2:-}" ]; then
            echo "::warning title=no aapt2::the packaged locales could not be read - no build-tools aapt2 on this runner"
            exit 0
          fi
          "$AAPT2" dump resources "$APK" > /tmp/apk-resources.txt 2>&1 || true
          echo "--- first lines of the resource dump"
          head -n 20 /tmp/apk-resources.txt || true
          found=$(grep -oE '\(([a-z]{2,3})(-[A-Za-z]{2,4})?\)' /tmp/apk-resources.txt | tr -d '()' | sort -u | tr '\n' ' ')
          echo "configs found: ${found:-none}"
          if [ -z "${found}" ]; then
            echo "::warning title=packaged locales::aapt2 printed no config lines, so the six languages could not be confirmed"
            exit 0
          fi
          missing=""
          for loc in de es fr it pl; do
            case " ${found} " in
              *" ${loc} "*) ;;
              *) missing="${missing} ${loc}" ;;
            esac
          done
          if [ -n "${missing}" ]; then
            echo "::error title=packaged locales::missing:${missing} (found: ${found})"
            exit 1
          fi
          echo "::notice title=packaged locales::the APK carries ${found}"

      - name: Verify the APK, then publish it where a phone can fetch it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          # What the file is, in numbers a report can be compared with: the first device report of
          # this build was "There was a problem parsing the package", and neither side knew whether
          # the phone held the file we built (finding 261).
          bytes=$(stat -c%s "$APK")
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "bytes=$bytes sha256=$sha"
          echo "::notice title=APK bytes::$bytes bytes, sha256 $sha"

          AAPT2=$(ls -1 "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "${AAPT2:-}" ]; then
            "$AAPT2" dump badging "$APK" > /tmp/badging.txt 2>&1 || true
            badging=$(grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' /tmp/badging.txt | tr '\n' ' ' | cut -c1-900)
            echo "$badging"
            echo "::notice title=APK badging::${badging}"
          else
            echo "::warning title=no aapt2::the APK's declared requirements could not be read"
          fi

          APKSIGNER=$(ls -1 "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "${APKSIGNER:-}" ]; then
            if "$APKSIGNER" verify --verbose "$APK" > /tmp/signer.txt 2>&1; then
              schemes=$(grep -E '^Verified using' /tmp/signer.txt | tr '\n' ' ')
              echo "::notice title=APK signature::verified - ${schemes}"
            else
              # A signature that does not verify is exactly what the phone refuses to parse. This
              # is the one condition here worth failing the build over.
              echo "::error title=APK signature::apksigner rejected the APK: $(head -n 6 /tmp/signer.txt | tr '\n' ' ')"
              exit 1
            fi
          fi

          # The direct link: no ZIP, no GitHub account, one URL that always holds the newest beta.
          cp "$APK" ConstructAR-beta.apk
          notes=$(printf '%s\n' \
            "ConstructAR Beta - commit ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d))" \
            "" \
            "Install: open the .apk on the phone, allow the source, install over the previous beta." \
            "" \
            "Size: ${bytes} bytes" \
            "SHA-256: ${sha}" \
            "Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "" \
            "Diagnostics stay on the phone: Hilfe -> Dateien speichern.")
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --title "ConstructAR Beta (zum Testen)" --notes "$notes" \
              || echo "::warning title=no release::the repository did not allow creating the 'beta' release, the artifact above is still there"
          fi
          if gh release view beta >/dev/null 2>&1; then
            gh release edit beta --title "ConstructAR Beta (zum Testen)" --notes "$notes" || true
            if gh release upload beta ConstructAR-beta.apk --clobber; then
              url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/beta/ConstructAR-beta.apk"
              echo "::notice title=direct download::${url}"
              echo "\`${url}\`" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "- ${bytes} bytes, sha256 \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=upload failed::the release asset was not replaced, the artifact above is still there"
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: constructar-beta-apk
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30
