name: pages

# The landing page in `docs/` is generated, not hand-edited: `tools/build_site.py` renders all six
# languages from one template, so the site cannot drift from the app's wording. This workflow
# re-renders it on every change to the generator or the translations and publishes the result to
# GitHub Pages - the free host the page is meant for.
#
# One-time setup, once this branch is merged into the default branch:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# (or `gh api -X POST repos/AndrexTheDev/ConstructAR/pages -F build_type=workflow`).
# Serving from a `docs/` folder on `main` works as well; the generator writes exactly the same
# files either way, and the build step below proves they exist before anything is published.
#
# Deliberately no third-party action beyond the official Pages ones, and no dependency install:
# the generator is pure standard library.
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "tools/build_site.py"
      - "tools/site_translations.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Render the six-language site
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages_enabled.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      # A repository whose Pages source has not been switched on yet would otherwise fail this
      # workflow on every push to `main`, and a permanent red check is how real failures stop
      # being noticed. So the state is interrogated first: 404 means "not configured", and the
      # job renders the site, verifies it, and stops there with a notice instead of an error.
      # Any other answer (including a permission error) is treated as "configured" so the real
      # failure still surfaces.
      - name: Is GitHub Pages enabled?
        id: pages_enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "Pages API status: $status"
          if [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages not enabled::Set Settings > Pages > Source: GitHub Actions, then re-run this workflow. The site is rendered and verified below either way."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Render docs/ from the generator
        run: |
          python3 tools/build_site.py
          test -f docs/index.html
          test -f docs/.nojekyll
          test -f docs/sitemap.xml
          test -f docs/404.html
          for lang in de es fr it pl; do
            test -f "docs/$lang/index.html" || { echo "missing docs/$lang/index.html"; exit 1; }
          done
          # Every language must carry the same key set - a half-translated page is a bug.
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import build_site
          base = set(build_site.CONTENT["en"])
          bad = {l: base - set(c) for l, c in build_site.CONTENT.items() if base - set(c)}
          if bad:
              print("languages with missing keys:", bad)
              sys.exit(1)
          print(f"{len(build_site.CONTENT)} languages, {len(base)} keys each")
          PY

      - name: Translation and price agreement
        run: |
          python3 tools/i18n_audit.py
          python3 tools/consistency_audit.py

      - name: SEO and structured-data audit
        # The gate the page has to pass before it is published: canonical and hreflang sets,
        # Open Graph and Twitter cards, JSON-LD that matches the real price list, every internal
        # link and anchor resolving, sitemap/robots/manifest agreeing with the pages.
        run: |
          python3 tools/seo_audit.py --verbose
          test -f docs/manifest.webmanifest || { echo "missing manifest"; exit 1; }

      - name: The committed site matches the generator
        # `docs/` is generated output. If a hand edit survives in the tree, the next deploy
        # silently reverts it; if a translation change was never rendered, the published page is
        # stale. `sitemap.xml` is exempt because its <lastmod> is deliberately today's date.
        run: |
          git add -A -- docs
          changed=$(git diff --cached --name-only -- docs | grep -v '^docs/sitemap.xml$' || true)
          if [ -n "$changed" ]; then
            echo "docs/ is out of date with tools/build_site.py:"
            echo "$changed"
            git diff --cached --stat -- docs
            exit 1
          fi
          echo "docs/ matches the generator"

      - uses: actions/configure-pages@v5
        if: steps.pages_enabled.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_enabled.outputs.enabled == 'true'
        with:
          path: docs

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
